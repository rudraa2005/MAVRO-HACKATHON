<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FlowGuard — Real-time traffic intelligence and wrong-way detection system">
    <title>{% block title %}FlowGuard{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    {% block head_extra %}{% endblock %}
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-place="{{ place_name }}" data-poll-interval-ms="{{ poll_interval_ms }}">
    <nav class="nav">
        <span class="nav-brand">FLOWGUARD</span>
        <ul class="nav-links">
            <li><a href="/" id="nav-dashboard" {% if active_page == 'dashboard' %}class="active"{% endif %}>Dashboard</a></li>
            <li><a href="/control" id="nav-control" {% if active_page == 'control' %}class="active"{% endif %}>Control</a></li>
            <li><a href="/analytics" id="nav-analytics" {% if active_page == 'analytics' %}class="active"{% endif %}>Analytics</a></li>
            <li><a href="/risk" id="nav-risk" {% if active_page == 'risk' %}class="active"{% endif %}>Risk</a></li>
        </ul>
    </nav>

    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
